name: H753 bring-up build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-h753-bringup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Build H753 firmware
        working-directory: firmware/boards/nucleo_h753zi
        run: make
      - name: Host-native H753 protocol helper
        working-directory: firmware/boards/nucleo_h753zi
        run: make test
